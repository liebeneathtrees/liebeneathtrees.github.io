<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>liebeneathtrees</title>

<style>
:root {
  --paper: #F1F4EE;
  --surface: #FAFBF8;
  --ink: #1D2A22;
  --muted: #56645A;
  --line: #D3DCCF;
  --moss: #3B6A47;
  --moss-ink: #FFFFFF;
  --leaf1: #6F9A6B;
  --leaf2: #4E7D57;
  --leaf3: #A9C29A;
  --error: #9B2C1F;
  --serif: "Young Serif", Georgia, "Times New Roman", serif;
  --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #121A15; --surface: #18221C; --ink: #E3EADF; --muted: #9DAD9F; --line: #2C3A31;
    --moss: #8EC096; --moss-ink: #10180F; --leaf1: #2F5A3A; --leaf2: #24472D; --leaf3: #476E4C;
    --error: #F2A08F; color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 1.0625rem/1.65 var(--sans); -webkit-font-smoothing: antialiased;
}
a { color: var(--moss); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--moss); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 1.5rem; }

/* Canopy */
.top { position: relative; overflow: hidden; }
.canopy { display: block; width: 100%; height: 240px; }
.canopy .l1 { fill: var(--leaf1); opacity: .85; }
.canopy .l2 { fill: var(--leaf2); opacity: .9; }
.canopy .l3 { fill: var(--leaf3); opacity: .8; }
.wordmark {
  position: absolute; top: 1.25rem; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 1040px; padding: 0 1.5rem;
}
.wordmark span {
  display: inline-block; margin-left: -0.75rem; background: var(--paper); color: var(--ink); font-weight: 600;
  padding: 0.3rem 0.75rem; border-radius: 999px; font-size: 0.95rem;
}

/* Hero */
.hero { padding-top: 1.5rem; padding-bottom: 3.5rem; }
.hero h1 {
  font: 400 clamp(2.4rem, 6vw, 4.2rem)/1.05 var(--serif); letter-spacing: -0.015em;
  margin: 0 0 1.25rem; max-width: 14ch;
}
.hero p { font-size: 1.2rem; color: var(--muted); max-width: 52ch; margin: 0; }

/* Topics */
.topics { padding-top: 3rem; padding-bottom: 3rem; }
.topics, .library { position: relative; }
.topics::before, .library::before { content: ""; position: absolute; top: 0; left: 1.5rem; right: 1.5rem; border-top: 1px solid var(--line); }
h2 { font: 400 1.75rem/1.2 var(--serif); margin: 0 0 1.5rem; }
.topic-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 0 2.5rem; }
.topic-list li { padding: 1rem 0; border-bottom: 1px solid var(--line); }
.topic-list strong { display: block; font-weight: 600; }
.topic-list span { color: var(--muted); font-size: 0.97rem; }

/* Library */
.library { padding-top: 3rem; padding-bottom: 4rem; }
.gate {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 2rem; max-width: 560px;
}
.gate h2 { margin-bottom: 0.5rem; }
.gate p { color: var(--muted); margin: 0 0 1.25rem; }
.gate label { display: block; font-weight: 600; font-size: 0.92rem; margin-bottom: 0.4rem; }
.gate .row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.gate input {
  flex: 1 1 220px; font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 8px; padding: 0.65rem 0.8rem;
}
.gate input:focus { border-color: var(--moss); }
button.primary {
  font: 600 1rem var(--sans); background: var(--moss); color: var(--moss-ink);
  border: 0; border-radius: 8px; padding: 0.65rem 1.3rem; cursor: pointer;
}
button.primary:disabled { opacity: .6; cursor: progress; }
.error { color: var(--error); font-size: 0.95rem; margin: 0.75rem 0 0; min-height: 1.4em; }

.projects[hidden], .gate[hidden] { display: none; }
.projects-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.projects-head h2 { margin: 0; }
button.quiet { font: 500 0.95rem var(--sans); background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }
.group { margin-top: 2.25rem; }
.group h3 { font: 600 0.95rem var(--sans); color: var(--moss); margin: 0 0 0.25rem; }
.group ul { list-style: none; margin: 0; padding: 0; }
.group li {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.25rem 1.5rem; align-items: baseline;
  padding: 1rem 0; border-bottom: 1px solid var(--line);
}
.group li a.title { font: 400 1.3rem/1.3 var(--serif); color: var(--ink); text-decoration: none; }
.group li a.title:hover { color: var(--moss); text-decoration: underline; }
.group li p { grid-column: 1; margin: 0; color: var(--muted); font-size: 0.97rem; max-width: 62ch; }
.group li a.src { grid-column: 2; grid-row: 1; font-size: 0.9rem; white-space: nowrap; }

footer { border-top: 1px solid var(--line); padding: 2rem 0 3rem; color: var(--muted); font-size: 0.92rem; }
footer .wrap { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

@media (max-width: 600px) {
  .canopy { height: 170px; }
  .gate { padding: 1.5rem; }
  .group li { grid-template-columns: 1fr; }
  .group li a.src { grid-column: 1; grid-row: auto; }
}
</style>
</head>
